name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git filtering

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # Disabled in favour of Turborepo Remote Caching (TURBO_TOKEN / TURBO_TEAM).
      # The local cache always wins over the remote one, which kept remote caching
      # idle and made it impossible to tell from the logs whether it worked at all.
      # Re-enable only if remote caching is turned off.
      # - name: Cache Turborepo
      #   uses: actions/cache@v4
      #   with:
      #     path: .turbo/cache
      #     key: ${{ runner.os }}-turbo-${{ github.sha }}
      #     restore-keys: |
      #       ${{ runner.os }}-turbo-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/snippet-manager/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/*.js', 'apps/**/*.jsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      - name: Run build, lint, and test
        run: pnpm exec turbo build lint test $FILTER
        env:
          # PRs only check what changed against the target branch (plus dependents).
          # Pushes to main run everything: root-level changes (lockfile, turbo.json)
          # map to the "//" package alone, which has no tasks and would verify nothing.
          FILTER: ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
